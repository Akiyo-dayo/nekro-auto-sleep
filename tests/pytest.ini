[pytest]
# Rootdir must stay inside tests/: the repo root doubles as the plugin package
# body, and pytest 8 imports any directory __init__.py it treats as a Package,
# which would pull in the NekroAgent host dependencies.
# tests/ must NOT contain an __init__.py: pytest >= 8.4 derives dotted module
# names by walking up every directory that has an __init__.py, so a tests
# package would make it import the conftest as
# ``nekro_auto_sleep.tests.conftest`` and execute the host-dependent plugin
# ``__init__.py`` before any test runs.
testpaths = .
pythonpath = . ..
